name: desktop

on:
  workflow_dispatch:
  push:
    branches:
      - prueba/electron
    tags:
      - "desktop-v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: dist:win
            artifact: windows
          - name: macos-arm64
            os: macos-15
            command: dist:mac
            artifact: macos-arm64
          - name: macos-x64
            os: macos-15-intel
            command: dist:mac
            artifact: macos-x64
          - name: linux-x64
            os: ubuntu-latest
            command: dist:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/backend/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install CPU-only PyTorch (Linux/Windows)
        if: runner.os != 'macOS'
        run: python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu

      # The CPU index does not publish macOS wheels; PyPI's macOS wheel is CPU-only.
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install "torch==2.14.1"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/backend/requirements-build.txt

      - name: Stage offline datasets
        run: python desktop/backend/stage_datasets.py

      - name: Build Python sidecar
        run: python -m PyInstaller desktop/backend/prebenchmark-sidecar.spec --noconfirm --distpath desktop/backend/dist --workpath desktop/backend/build

      - name: Smoke test frozen sidecar
        run: python desktop/scripts/smoke_sidecar.py

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Package desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
